<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Playground Canvas</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="src/style.css">
  <link rel="stylesheet" href="src/canvas.css">
</head>
<body>
  <!-- The canvas version of the playground (branch "canvas"). Main and every
       exploration are frames on one canvas; each frame is the app itself,
       running its own layers. The canvas fills everything under the header,
       and the classic playground's panels float over it: Properties, Files
       and Library at the left, Claude at the right. Each minimises to a strip
       at its edge and springs open again from it. See src/canvas.js. -->
  <!-- No header: one row of round pieces over the canvas, above the panels,
       in the panels' look. Home at the left, with where you are: the selected
       frame's name (else the project's), to read only; only its round icon goes home; the toolbar in
       the middle; Share and Commit at the right. Inspect's own button
       (inspect.js) waits hidden in #subbar. -->
  <div class="cv-top" id="subbar">
    <div class="cv-float cv-home" id="home">
      <button type="button" class="cv-icon cv-home-icon" id="btn-fit" aria-label="Home: show every frame" title="Home: show every frame (⇧1)"></button>
      <span class="cv-where" id="name" aria-live="polite">Playground</span>
      <span class="cv-status" id="status" data-state="busy" hidden></span>
    </div>
    <div class="cv-tools cv-float" id="tools" role="toolbar" aria-label="Tools for the selected frame"></div>
    <div class="cv-actions">
      <button type="button" class="cv-float cv-fillfloat" id="btn-fill" hidden></button>
      <button type="button" class="cv-float cv-share" id="btn-share" aria-label="Share" title="Share" aria-haspopup="menu"></button>
      <button type="button" class="cv-float cv-commit" id="btn-commit" title="Move the picked iterations into the app and commit them">Commit</button>
    </div>
    <span class="spacer" hidden></span>
  </div>

  <div class="cv-layout">
    <div class="cv-card">
      <main class="cv-stage" id="stage" aria-label="Canvas">
        <div class="cv-world" id="world"></div>
        <div class="cv-shield" id="shield" hidden></div>
        <div class="pg-shield"></div>
        <!-- The readers of Files and Library open over the canvas. -->
        <div class="cv-workspace" id="workspace"></div>
      </main>
    </div>
    <!-- The panels: src/panels.js puts Properties, Files and Library in the left one. -->
    <aside class="cv-side at-left" id="side-props" aria-label="Properties and files"></aside>
    <aside class="cv-side at-right" aria-label="Chats">
      <div class="pg-panel pg-claude" id="claude">
        <button type="button" class="pg-rail" aria-expanded="true" aria-controls="claude-body" title="Expand Chats (P)">
          <span class="pg-rail-arrow" aria-hidden="true">‹</span><span class="pg-rail-label">Chats</span><span class="pg-rail-dot" hidden></span>
        </button>
        <div class="pg-body" id="claude-body">
          <div class="pg-head"><h2>Chats</h2><button type="button" class="pg-min" data-close aria-label="Minimise Chats" title="Minimise (P)">›</button></div>
          <div class="cv-chat" id="composer"></div>
        </div>
      </div>
    </aside>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="src/canvas.js"></script>
</body>
</html>
