<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Playground Canvas</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="src/style.css">
  <link rel="stylesheet" href="src/canvas.css">
</head>
<body>
  <!-- The canvas version of the playground (branch "canvas"). Main and every
       exploration are frames on one canvas; each frame is the app itself,
       running its own layers. The canvas fills everything under the header,
       and the classic playground's panels float over it: Properties, Files
       and Library at the left, Claude at the right. Each minimises to a strip
       at its edge and springs open again from it. See src/canvas.js. -->
  <header class="cv-bar" id="subbar">
    <span class="cv-status" id="status" data-state="busy" title="Starting the app…"></span>
    <h1 id="name">Playground</h1>
    <span class="cv-spacer spacer"></span>
    <span class="cv-zoom" id="zoom-label">100%</span>
    <button type="button" class="cv-icon" id="btn-fit" aria-label="Show every frame" title="Show every frame (⇧1)"></button>
    <a class="cv-icon" id="classic" target="_blank" rel="noopener" aria-label="The classic playground" title="The classic playground"></a>
    <button type="button" class="cv-share" id="btn-share" disabled title="Sharing with the team comes with the team version">Share</button>
    <button type="button" class="cv-commit" id="btn-commit" title="Move the picked iterations into the app and commit them">Commit</button>
  </header>

  <div class="cv-layout">
    <div class="cv-card">
      <main class="cv-stage" id="stage" aria-label="Canvas">
        <div class="cv-world" id="world"></div>
        <div class="cv-shield" id="shield" hidden></div>
        <div class="pg-shield"></div>
        <div class="cv-tools" id="tools" role="toolbar" aria-label="The selected frame" hidden></div>
        <!-- The readers of Files and Library open over the canvas. -->
        <div class="cv-workspace" id="workspace"></div>
      </main>
    </div>
    <!-- The panels: src/panels.js puts Properties, Files and Library in the left one. -->
    <aside class="cv-side at-left" id="side-props" aria-label="Properties and files"></aside>
    <aside class="cv-side at-right" aria-label="Chat with Claude">
      <div class="pg-panel pg-claude" id="claude">
        <button type="button" class="pg-rail" aria-expanded="true" aria-controls="claude-body" title="Expand Claude (P)">
          <span class="pg-rail-arrow" aria-hidden="true">‹</span><span class="pg-rail-label">Claude</span><span class="pg-rail-dot" hidden></span>
        </button>
        <div class="pg-body" id="claude-body">
          <div class="pg-head"><h2>Claude</h2><button type="button" class="pg-min" data-close aria-label="Minimise Claude" title="Minimise (P)">›</button></div>
          <div class="cv-chat" id="composer"></div>
        </div>
      </div>
    </aside>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="src/canvas.js"></script>
</body>
</html>
